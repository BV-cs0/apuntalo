name: Publicar en PyPI y en la Release

# Se lanza solo al publicar una Release en GitHub (después de subir __version__).
# También se puede lanzar a mano: Actions > Publicar en PyPI y en la Release > Run workflow
# (eso solo reconstruye para comprobar que compila; con workflow_dispatch no hay Release
# donde subir el .exe, así que ese paso se salta).
# El paquete de PyPI usa "Trusted Publishing" (ya configurado para BV-cs0/apuntalo, entorno
# "pypi"): no hace falta guardar ninguna contraseña ni token en GitHub.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir el paquete
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: paquete
          path: dist/

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apuntalo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquete
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Si esa versión ya está en PyPI, no falla: la deja como está.
          skip-existing: true

  construir_exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de compilación
        run: py -3 -m pip install pyinstaller anthropic pyspellchecker
      - name: Compilar Apuntalo.exe
        run: |
          py -3 -m PyInstaller --noconfirm --onefile --windowed --name Apuntalo --icon apuntalo\apuntalo.ico --add-data "apuntalo\captura.ps1;apuntalo" --add-data "apuntalo\crear_acceso.ps1;apuntalo" --add-data "apuntalo\apuntalo.ico;apuntalo" --collect-data spellchecker apuntes.pyw
      # Solo hay una Release donde subir el .exe cuando el workflow se lanzó al publicarla.
      - name: Subir Apuntalo.exe a la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Apuntalo.exe
