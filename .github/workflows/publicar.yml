name: Publicar en PyPI

# Se lanza a mano: Actions > Publicar en PyPI > Run workflow, después de subir __version__.
# Usa "Trusted Publishing" de PyPI (ya configurado para BV-cs0/apuntalo, entorno "pypi"):
# no hace falta guardar ninguna contraseña ni token en GitHub.
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir el paquete
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: paquete
          path: dist/

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apuntalo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquete
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
