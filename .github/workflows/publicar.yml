name: Publicar en PyPI

# Al publicar una Release en GitHub, se construye el paquete y se sube a PyPI.
# Usa "Trusted Publishing" de PyPI: no hace falta guardar ninguna contraseña ni token en GitHub.
on:
  release:
    types: [published]

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir el paquete
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: paquete
          path: dist/

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apuntalo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquete
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
